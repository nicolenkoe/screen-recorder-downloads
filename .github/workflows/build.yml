name: Build and verify applications
on:
  push:
    branches: [main]
    paths: ['android/**', 'windows/**', 'scripts/**', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Checks
        run: bash scripts/check.sh
      - name: Compile Android
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-for-verification
          path: build/android/ScreenRecorder-unsigned.apk
      - name: Signing setup status
        env:
          KEY_PRESENT: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$KEY_PRESENT" != true ]; then
            echo 'Compilation checked. To publish installable updates, add KEYSTORE_BASE64 and KEYSTORE_PASSWORD from the private signing backup.' >> "$GITHUB_STEP_SUMMARY"
          fi
  windows:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audio gain
        run: gcc -std=c11 -Wall -Wextra tests/audio-gain.c -lm -o /tmp/audio-gain-test && /tmp/audio-gain-test
      - run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-3.0.2
          path: build/windows/ScreenRecorder-Windows-3.0.2.exe
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view windows-3.0.2 >/dev/null 2>&1; then
            gh release upload windows-3.0.2 build/windows/ScreenRecorder-Windows-3.0.2.exe --clobber
          else
            gh release create windows-3.0.2 build/windows/ScreenRecorder-Windows-3.0.2.exe --title "Windows 3.0.2" --notes "Independent microphone and computer audio gain sliders, persisted volume levels and compact Scale menu; gallery preview and non-destructive trimming. Capture modes have native visual explanations, including an animated area selector. Multiple-window capture is not implemented; its diagram can be viewed but recording is disabled."
          fi
