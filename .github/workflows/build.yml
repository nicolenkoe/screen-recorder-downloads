name: Build and verify applications
on:
  push:
    branches: [main]
    paths: ['android/**', 'windows/**', 'scripts/**', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Checks
        run: bash scripts/check.sh
      - name: Compile Android
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-for-verification
          path: build/android/ScreenRecorder-unsigned.apk
      - name: Signing setup status
        env:
          KEY_PRESENT: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$KEY_PRESENT" != true ]; then
            echo 'Compilation checked. To publish installable updates, add KEYSTORE_BASE64 and KEYSTORE_PASSWORD from the private signing backup.' >> "$GITHUB_STEP_SUMMARY"
          fi
  windows:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audio gain
        run: gcc -std=c11 -Wall -Wextra tests/audio-gain.c -lm -o /tmp/audio-gain-test && /tmp/audio-gain-test
      - name: Verify timeline and edit planner
        run: gcc -std=c11 -Wall -Wextra tests/edit-model.c -lm -o /tmp/edit-model-test && /tmp/edit-model-test
      - name: Verify automatic pause cut intervals
        run: gcc -std=c11 -Wall -Wextra -Wno-unused-function tests/pause-model.c -lm -o /tmp/pause-model-test && /tmp/pause-model-test
      - run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-3.1.0
          path: build/windows/ScreenRecorder-Windows-3.1.0.exe
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view windows-3.1.0 >/dev/null 2>&1; then
            gh release upload windows-3.1.0 build/windows/ScreenRecorder-Windows-3.1.0.exe --clobber
          else
            gh release create windows-3.1.0 build/windows/ScreenRecorder-Windows-3.1.0.exe --prerelease --title "Windows 3.1.0 (тестовая)" --notes "Automatic still-pause removal with conservative audio protection (non-silent sound above -50 dB and 250 ms margins; does not classify speech). Recording countdown 3-2-1, always-on-top recording panel and red frame; live microphone/system sound toggles; filmstrip editing with multiple keep/remove ranges and separate fragment export; imported videos, selectable thumbnail/list/table gallery, file actions; three themes, 110 percent scale and dark Windows title bars. Capture exclusion requires Windows support; if unavailable the app asks before displaying indicators that may appear in the recording."
          fi
